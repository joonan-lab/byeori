[project]
name = "byeori"
version = "0.1.0b1"
description = "A serverless scientific knowledge system: original papers, evidence notes and syntheses in your own AWS account."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "boto3[crt]>=1.40,<2",
  "httpx>=0.28,<1",
  "mcp>=1.13,<2",
]

[project.scripts]
byeori = "byeori.cli:main"
byeori-mcp = "byeori.mcp_server:main"
byeori-lab-mcp = "byeori.lab_mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pyyaml>=6,<7",
  "cfn-lint>=1.30,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/byeori"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
